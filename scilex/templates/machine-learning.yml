# SciLEx domain template: machine-learning
# Machine learning / AI. Conference-driven and preprint-heavy: relaxed citation filter, arXiv and Semantic Scholar first.
# Edit keywords, years and collect_name, then run: scilex-collect
keywords:
  - ["deep learning", "neural network", "transformer"]
  - ["benchmark", "evaluation", "large language model"]
bonus_keywords: []
years:
  - 2022
  - 2023
  - 2024
  - 2025
apis:
  - Arxiv
  - SemanticScholar
  - OpenAlex
  - DBLP
semantic_scholar_mode: regular
collect_name: machine-learning_review
aggregate_get_citations: true
quality_filters:
  enable_itemtype_filter: true
  allowed_item_types:
    - conferencePaper
    - journalArticle
    - preprint
  require_abstract: true
  require_doi: false
  apply_citation_filter: false
  max_papers: 1500
  validate_abstracts: false
